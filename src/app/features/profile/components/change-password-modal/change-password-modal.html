<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md transition-opacity duration-300"
  (click)="onClose()">
  <div
    class="relative w-full max-w-4xl overflow-hidden rounded-3xl bg-neutral-900 border border-neutral-800 shadow-2xl text-white grid grid-cols-1 md:grid-cols-2 min-h-[500px]"
    (click)="$event.stopPropagation()">
    <button type="button" (click)="onClose()"
      class="absolute top-4 right-4 z-20 grid size-9 place-items-center rounded-full bg-neutral-800/80 text-neutral-400 hover:text-white hover:bg-neutral-700 transition-colors"
      aria-label="Close modal">
      <i class="pi pi-times text-lg"></i>
    </button>

    <div class="relative hidden md:flex flex-col justify-between p-8 bg-cover bg-center overflow-hidden"
      style="background-image: url('images/auth/authlayout-bg.png');">
      <div class="absolute inset-0 bg-neutral-950/60 backdrop-blur-[2px]"></div>

      <div class="relative z-10 flex items-center">
        <a routerLink="/home" (click)="onClose()" class="cursor-pointer">
          <img src="images/auth/auth-logo.png" alt="Super Fitness Logo" class="h-12 w-auto" />
        </a>
      </div>

      <div class="relative z-10 my-auto flex justify-center py-4">
        <img src="images/auth/authlayout-img.png" alt="Athlete on bench"
          class="max-h-[320px] w-auto object-contain drop-shadow-2xl" />
      </div>
    </div>

    <div class="flex flex-col justify-center p-6 md:p-10 bg-neutral-900/90">
      <div class="w-full max-w-sm mx-auto space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-bold tracking-tight text-white uppercase">
            {{ 'PROFILE.CHANGE_PASSWORD' | translate }}
          </h2>
        </div>

        <form [formGroup]="form" (ngSubmit)="submitChangePassword()" class="space-y-4" novalidate>
          <app-input id="change-current-password" type="password" [placeholder]="'PROFILE.CURRENT_PASSWORD' | translate"
            leadingIcon="pi pi-lock" formControlName="password" [required]="true"
            [invalid]="showError(form.controls.password)" [errorMessage]="currentPasswordError() | translate" />

          <app-input id="change-new-password" type="password" [placeholder]="'PROFILE.NEW_PASSWORD' | translate"
            leadingIcon="pi pi-lock" formControlName="newPassword" [required]="true"
            [invalid]="showError(form.controls.newPassword)" [errorMessage]="newPasswordError() | translate" />

          <app-input id="change-confirm-password" type="password"
            [placeholder]="'PROFILE.CONFIRM_NEW_PASSWORD' | translate" leadingIcon="pi pi-lock"
            formControlName="confirmation" [required]="true" [invalid]="confirmationInvalid()"
            [errorMessage]="confirmationError() | translate" />

          <app-button type="submit" [fullWidth]="true" [disabled]="form.invalid">
            {{ 'PROFILE.SAVE' | translate }}
          </app-button>
        </form>
      </div>
    </div>
  </div>
</div>
